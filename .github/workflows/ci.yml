name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/lingerie_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingerie-backend-${{ github.sha }}
          path: |
            dist
            prisma/schema.prisma
            prisma/migrations
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: Deploy backend production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND_PROD }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing GitHub secret: VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing GitHub secret: VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing GitHub secret: VERCEL_PROJECT_ID_BACKEND_PROD"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND_PROD }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Validate pulled database URL
        run: |
          ENV_FILE=".vercel/.env.production.local"
          test -f "$ENV_FILE" || { echo "Vercel production environment file was not pulled: $ENV_FILE"; exit 1; }
          DATABASE_URL_LINE="$(grep '^DATABASE_URL=' "$ENV_FILE" | head -n 1 || true)"
          test -n "$DATABASE_URL_LINE" || {
            echo "Missing Vercel DATABASE_URL: add DATABASE_URL to the Production environment variables."
            exit 1
          }
          DATABASE_URL_VALUE="$(printf '%s' "$DATABASE_URL_LINE" | cut -d '=' -f 2- | sed -e "s/^[\"']//" -e "s/[\"']$//")"
          test -n "$DATABASE_URL_VALUE" || {
            echo "Empty Vercel DATABASE_URL: set a PostgreSQL URL in Production environment variables."
            exit 1
          }
          DATABASE_URL_SCHEME="${DATABASE_URL_VALUE%%:*}"
          echo "Vercel DATABASE_URL scheme: ${DATABASE_URL_SCHEME:-missing}"
          [[ "$DATABASE_URL_VALUE" == postgresql://* || "$DATABASE_URL_VALUE" == postgres://* ]] || {
            echo "Invalid Vercel DATABASE_URL: the Production value must start with postgres:// or postgresql://."
            exit 1
          }

      - name: Build Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND_PROD }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy backend production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND_PROD }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
