services:
  - type: web
    name: lingerie-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: lingerie
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ADMIN_PHONE
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v25.0
      - key: WHATSAPP_ORDER_TEMPLATE
        value: order_admin_notification
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: fr
      - key: RESEND_API_KEY
        sync: false
      - key: NEWSLETTER_FROM_EMAIL
        sync: false
      - key: NEWSLETTER_SITE_URL
        sync: false